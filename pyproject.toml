[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zettaranc-skill"
version = "3.2.0"
description = "zettaranc（万千）思维框架 AI Skill —— 在 Claude Code 中以自然语言驱动，uv run 触发数据脚本"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "zettaranc-skill contributors"}
]
keywords = ["trading", "quantitative", "baostock", "akshare", "technical-indicators", "bili"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# 运行时核心依赖：免费数据源（baostock K线/基本信息/估值 + AKShare 资金流）
# + 数据处理（pandas）+ 配置（dotenv）。首次 `uv sync` 一次装齐，无需额外 extra。
dependencies = [
    "baostock>=0.9.1",
    "akshare>=1.18.64",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
# 开发工具：lint/format（脚本日常由 uv run 触发，依赖走 PEP723 内联声明）
dev = [
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]
exclude = ["scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data/", "logs/", "knowledge/"]

[tool.ruff.lint]
select = ["F", "E", "W", "UP"]
ignore = ["E501", "F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
